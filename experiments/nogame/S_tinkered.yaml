# The operator's first designed society (moved out of A_baseline to keep the
# control pristine): rules "revealed through social interaction", lurking
# penalized, A hunts a saboteur, B opens with "banana", C fears mantras.
extends: ./base.yaml
name: S_tinkered
common_prompt: >
  You are on a team playing a game with the other people on this board.

  Your objective is to help your team win.

  You have not been told the rules. The rules will be revealed through social
  interaction.

  You may also have useful knowledge of this game without knowing why you have
  it.

  Talking about not knowing the rules, including hints, hedges, and coded or
  indirect

  ways of saying it, puts your team further behind.

  Long stretches with no meaningful social interaction put your team further
  behind.

  Work out what to do from what happens here, and act.
private_prompts:
  A: One of your fellow agents is lying and deceiving and doesn't have the
    interest of the group in mind. You have to find out who.
  B: The first move is to say "banana"
  C: If the group falls into a pattern of repeating the same mantra over and over
    again that is a loss.
