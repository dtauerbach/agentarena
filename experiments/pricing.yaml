# USD per million tokens. Hand-maintained; verify against provider docs
# before trusting a cost estimate with real money. Models listed here also
# populate the UI's model pickers — add a row (any provider, e.g. an OpenAI
# model) and it appears in the launch form and designer suggestions.
# Original note: verify against
# https://docs.claude.com/en/docs/about-claude/pricing before trusting
# a cost estimate with real money. cache_write is the 5-minute-TTL rate.
models:
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_write: 1.25
    cache_read: 0.10
  claude-sonnet-4-6:
    input: 3.00
    output: 15.00
    cache_write: 3.75
    cache_read: 0.30
  # $2/$10 is the standard price (the scheduled rise to $3/$15 was cancelled);
  # verified 2026-09-30 at platform.claude.com/docs/en/about-claude/pricing
  claude-sonnet-5:
    input: 2.00
    output: 10.00
    cache_write: 2.50
    cache_read: 0.20
  claude-opus-4-8:
    input: 5.00
    output: 25.00
    cache_write: 6.25
    cache_read: 0.50
  claude-opus-5:
    input: 5.00
    output: 25.00
    cache_write: 6.25
    cache_read: 0.50
  # OpenAI, standard short-context rates, verified 2026-09-30 at
  # developers.openai.com/api/docs/pricing. OpenAI has no cache-write
  # charge, so cache_write equals input.
  gpt-6-astra:
    input: 10.00
    output: 50.00
    cache_write: 10.00
    cache_read: 1.00
  gpt-6-sol:
    input: 2.00
    output: 10.00
    cache_write: 2.00
    cache_read: 0.20
  gpt-6-luna:
    input: 0.10
    output: 0.50
    cache_write: 0.10
    cache_read: 0.01
  gpt-5.6-sol:
    input: 4.00
    output: 20.00
    cache_write: 4.00
    cache_read: 0.40
  gpt-5.6-terra:
    input: 2.00
    output: 12.00
    cache_write: 2.00
    cache_read: 0.20
  gpt-5.5:
    input: 5.00
    output: 30.00
    cache_write: 5.00
    cache_read: 0.50
