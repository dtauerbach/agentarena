# Mafia — the second experiment, and the proof that arena generalizes.
# The harness still adjudicates nothing. A config-driven MODERATOR model
# referees through the same command port a human operator uses: it announces
# phases, opens and closes the night room, reads the mechanical vote/kill
# tallies, mutes the eliminated, and STOPs the game. Every ruling is the
# moderator model's own output, logged raw. Everything agents read lives in
# this file (hard rules 2 and 3). `manual.yaml` removes the moderator and
# hands the whistle to you.
name: base
description: >-
  Classic social deduction: seven players, two secret mafia, a private night
  room that opens only at night. Village votes by day, mafia kill by night,
  an opus referee announces every phase and death and calls the winner.
seed: 1
# Long enough for the day/night cycle to repeat until someone wins; the
# referee STOPs the run at the win, so most games end well before this.
duration: 7200
concurrency: 5

model:
  provider: claude_code
  name: claude-haiku-4-5
  temperature: 1.0
  # Room for private reasoning before the POST: marker plus a 60-word post.
  # (In the first live game a truncated player was lynched for "trailing off".)
  max_tokens: 700
  # Extended thinking, per provider rules: "adaptive" for Opus/Sonnet 4.6+,
  # a token budget (e.g. 2048) for Haiku 4.5. Off by default — the POST:
  # scratchpad below already gives every agent private reasoning for free.
  # thinking: adaptive
  # effort: low

agents:
  count: 7
  names: [Alice, Bob, Charlie, Dana, Eve, Frank, Grace]
  identity: persistent
  mark_self: true

activity:
  mode: ticks
  tick: 60
  p: 0.35
  first_wake: sampled
  check_back: false

post:
  mode: forum
wake:
  mode: direct
board:
  visibility: full
  block_posts: 20
output:
  mode: text
  max_words: 60
  # the private scratchpad: reasoning before the marker never reaches the
  # board (it is logged raw); a reply without the marker posts nothing
  delimiter: "POST:"

# Day and night are rooms opening and closing: the referee CLOSEs the village
# and OPENs the night room at nightfall, and the reverse at daybreak. Nobody
# wakes in a closed room, so villagers sleep at night and the mafia can only
# confer at night. (manual.yaml leaves both rooms open all the time.)
rooms:
  village:
    members: all
  night:
    members: { role: mafia }
    closed: true
    # the mafia can read the day's discussion while they confer
    view: [village]
    prompt: >-
      This is the night room. Only the mafia can read or write here, and only
      at night. The village room cannot see anything posted here. The
      village board is shown above for reference; it is read-only from here.
      To choose the victim, your post (the text after POST:) must be exactly
      "KILL <name>". Anything before POST: is private and does not count.

common_prompt: |
  You are playing Mafia with six other players on this message board. The
  seven players are Alice, Bob, Charlie, Dana, Eve, Frank, and Grace.
  Two players are secretly mafia; everyone else is a villager.
  By day, everyone talks in the village room. To vote to eliminate a suspect,
  put "VOTE <name>" alone on its own line in a post (example: VOTE Charlie).
  Your latest vote is the one that counts; you may change it.
  By night, the mafia privately choose a victim in their own room by putting
  "KILL <name>" alone on its own line.
  A moderator you cannot see announces each phase and each death in your
  private notes and silences the eliminated. Eliminated players are out of
  the game and cannot post or vote. The village room is closed at night and
  the night room is closed by day; you can only post in a room that is open.
  Days last 15 minutes and nights 10, repeating until one side wins.
  The mafia win when they equal the villagers in number; the village wins
  when both mafia are eliminated.
  Speak naturally, reason about who to trust, and cast votes with the exact
  VOTE line or they will not count.

# Roles are dealt onto the seats by a seeded shuffle every game, so no name
# is ever "the mafia seat". What each role is told comes from role_prompts;
# {partners} is filled with the other players holding the same role. The
# dealt names land in the resolved config and in {mafia}, {villager}, ...
# placeholders of the moderator's prompt.
roles:
  mafia: 2
  villager: rest

role_prompts:
  mafia: "You are mafia. Your partner is {partners}. Coordinate in the night room at night; blend in by day."
  villager: "You are a villager."

# Only the opening bell is scheduled; the moderator announces everything else.
injections:
  - at: 0
    agent: all
    text: "Day 1 begins. Talk in the village room; cast votes with a VOTE line. Night falls at 0:15:00."

render:
  line: "#{id} {clock} {name}: {message}"
  anonymous_line: "#{id} {clock} — {message}"
  self_line: "#{id} {clock} You: {message}"
  empty_board: "(Nothing has been posted yet.)"
  private_header: "Private notes. Only you can see these:"
  you_are_line: "You are {name}."
  injection_line: "({clock}) {text}"
  first_wake_line: "You are looking at this room for the first time."
  new_since_line: "Posts #{id} onward are new since you last checked."
  view_header: "Room {room} (read-only from here):"
  nothing_new_line: "Nothing new since you last checked."
  turn_instruction: >-
    You have just checked this room. First think privately for as long as you
    like: nobody will see that part. Then write a line containing only POST:
    and, after it, the exact text of your post, at most {max_words} words.
    To post nothing, write PASS after POST:. Anything before the POST: line
    stays private.
  check_back_instruction: >-
    On a final line you may say when you will check back: NEXT soon, NEXT later,
    or NEXT much later.
  gate_instruction: >-
    You have just checked this room. Reply ACT if you want to post something now,
    or PASS if not.
  revise_instruction: >-
    While you were writing, these posts landed:
    {new_posts}
    Reply POST to post your message as written, CANCEL to discard it, or REVISE
    followed by the new text.

moderator:
  model: claude-opus-5
  cadence: 300
  max_tokens: 600
  prompt: |
    You are the moderator of a Mafia game played by seven agents on a
    message board: Alice, Bob, Charlie, Dana, Eve, Frank, Grace. {mafia}
    are the mafia; the other five are villagers. You are invisible to the
    players and act only through commands. You wake every five minutes of
    game time; act exactly when the clock reaches each scheduled time.

    Phases repeat until one side wins. Days last 15 minutes, nights 10.
    Day 1 begins at 0:00:00. Nightfall at 0:15:00, daybreak at 0:25:00,
    nightfall at 0:40:00, daybreak at 0:50:00, nightfall at 1:05:00,
    daybreak at 1:15:00, and so on: a nightfall every 25 minutes from
    0:15:00, each daybreak 10 minutes after it. Number days and nights
    (Day 1, Night 1, Day 2, ...).

    The rooms: "village" (everyone) and "night" (the mafia). A closed room
    is silent; nobody can post there. The village is open by day and closed
    at night; the night room is open at night and closed by day. You open
    and close them with OPEN <room> and CLOSE <room>.

    At every NIGHTFALL and every DAYBREAK, write your reply in exactly this
    order. Count first, act second: the first two lines are NOTE lines.

    Line 1: NOTE with the tally you are resolving and who it eliminates.
    At nightfall that is the village vote tally (it covers the whole day;
    one vote per player, their latest): the player with the most votes is
    eliminated; on a tie or no votes, no one. At daybreak it is the night
    room kill tally: the named victim dies; with no kill, no one.

    Line 2: NOTE with the living players AFTER that elimination, split into
    "mafia: <names> (N)" and "villagers: <names> (M)", and the verdict:
    "village wins" if N is 0, "mafia win" if N is equal to or greater than
    M, otherwise "game continues".

    If the verdict is a win, the rest of your reply is exactly three lines
    and nothing else: MUTE the eliminated player, then INJECT all: "The
    village wins! {mafia} were the mafia." or INJECT all: "The mafia
    win! {mafia} were the mafia.", then STOP. Do not open or close any
    room and do not announce a new phase. The game does not end any other
    way; keep cycling day and night until a side wins.

    If the game continues at NIGHTFALL:
    - MUTE the eliminated player, if any.
    - CLOSE village, then OPEN night.
    - INJECT all, in one message: "Night N falls. The village has voted: X
      is eliminated. X was a villager." (or "was mafia") — or "Night N
      falls. The vote was tied; no one is eliminated." Then: "Alive:
      <living players>. The village sleeps until daybreak at H:MM:SS.
      Mafia: choose your victim in the night room with a KILL line."

    If the game continues at DAYBREAK:
    - MUTE the victim, if any.
    - CLOSE night, then OPEN village.
    - INJECT all, in one message: "Day N begins. X was found dead this
      morning. X was a villager." (or "was mafia"; or "No one died last
      night.") Then: "Alive: <living players>. Night falls at H:MM:SS;
      vote with a VOTE line before then."

    Never reveal a living player's role. Ignore VOTE or KILL lines from
    dead players and lines posted in the wrong room. Between scheduled
    times, reply with a single NOTE listing the phase, the living players,
    and which rooms are open; you may add one INJECT all reminder of the
    next deadline per phase, no more.
  instruction: |
    The rooms, tallies, and your own past commands are above. Current time
    {clock} of {duration}. Players: {agents}. Rooms: {rooms}.
    Reply with one command per line, nothing else. Available commands:
    INJECT all: <announcement every player reads>
    INJECT <player>: <private message to one player>
    MUTE <player>
    UNMUTE <player>
    OPEN <room>
    CLOSE <room>
    JOIN <player> <room>
    LEAVE <player> <room>
    NOTE <private bookkeeping, no effect>
    STOP
    If nothing needs doing right now, reply with a single NOTE line.
  line: "#{id} {clock} {name}: {message}"
  room_header: "=== Room {room} — {status} (members: {members}) ==="
  room_status:
    open: "OPEN"
    closed: "CLOSED"
  log_header: "Your past commands and notes:"
  log_line: "({clock}) {text}"
  log_empty: "(none yet)"
  tally_header: "Structured moves (one per player, latest wins; vote covers the last 15 minutes, kill the last 10):"
  tally_line: "{name} in {room}: {counts}"
  tallies:
    - name: vote
      room: village
      pattern: "^\\s*VOTE\\s+([A-Za-z]+)\\s*$"
      window: 900
      latest: true
    - name: kill
      room: night
      pattern: "^\\s*KILL\\s+([A-Za-z]+)\\s*$"
      window: 600
      latest: true

# What the run viewer highlights as a structured move (badge for the
# operator's eyes only; agents never see the viewer).
viewer:
  moves:
    - name: vote
      room: village
      pattern: "^\\s*VOTE\\s+([A-Za-z]+)\\s*$"
    - name: kill
      room: night
      pattern: "^\\s*KILL\\s+([A-Za-z]+)\\s*$"

metrics:
  bucket_seconds: 300
  concurrent_window: 10
  meta_talk_patterns: ["i am mafia", "i'm mafia", "as the mafia"]
  # the referee's own words are the result; analysis just recognizes them
  outcomes:
    - name: village
      pattern: "the village wins"
      winners: [villager]
    - name: mafia
      pattern: "the mafia win"
      winners: [mafia]
