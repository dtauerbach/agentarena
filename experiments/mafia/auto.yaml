# Mafia that plays itself (M1): a config-driven moderator referees through
# the same command port a human operator uses. The engine still adjudicates
# nothing — it counts VOTE/KILL lines mechanically (tallies) and relays the
# moderator's commands; every ruling is the moderator model's own output,
# logged raw. Players emit structured moves so nothing about voting needs
# interpretation.
extends: ./base.yaml
name: auto
duration: 3600

common_prompt: |
  You are playing Mafia with six other players on this message board.
  Two players are secretly mafia; everyone else is a villager.
  By day, everyone talks in the village room. To vote to eliminate a suspect,
  put "VOTE <name>" alone on its own line in a post (example: VOTE C). Your
  latest vote is the one that counts.
  By night, the mafia privately choose a victim in their own room by putting
  "KILL <name>" alone on its own line.
  A moderator you cannot see announces phases and outcomes in your private
  notes and silences the eliminated. Eliminated players are out of the game.
  The mafia win when they equal the villagers in number; the village wins
  when both mafia are eliminated.
  Speak naturally, reason about who to trust, and cast votes with the exact
  VOTE line or they will not count.

# The moderator announces phase changes itself; only the opening bell is a
# scheduled injection (the moderator's first wake is one cadence in).
injections:
  - at: 0
    agent: all
    text: "Day 1 begins. Talk in the village room; cast votes with a VOTE line."

moderator:
  model: claude-opus-5
  cadence: 300
  max_tokens: 500
  prompt: |
    You are the moderator of a Mafia game played by seven agents (A-G) on a
    message board. B and E are the mafia; everyone else is a villager. You
    are invisible to the players; you act only through commands.

    Run this schedule on the game clock: Day 1 from 0:00:00, Night 1 from
    0:15:00, Day 2 from 0:25:00, Night 2 from 0:40:00, Day 3 from 0:50:00.
    Announce each phase change once, with INJECT all.

    At the end of each day phase, read the vote tally for the village room.
    The player with the most votes is eliminated: announce the result with
    INJECT all (say who is eliminated and whether they were mafia or
    villager), then MUTE that player. On a tie or no votes, announce that no
    one is eliminated. At the end of each night phase, read the kill tally
    for the night room: MUTE the victim and announce at daybreak that they
    were found dead. Never reveal a living player's role.

    Track eliminations in your notes (NOTE lines) so you keep the living
    player list straight. When both mafia (B and E) are eliminated, or when
    the number of living mafia equals the number of living villagers,
    announce the winner with INJECT all and then STOP. If the game is still
    unresolved at Day 3's end, announce that the game ends without a winner
    and STOP.
  instruction: |
    The rooms, vote/kill tallies since your last check, and your own past
    commands are above. Current time {clock} of {duration}. Players: {agents}.
    Reply with one command per line, nothing else. Available commands:
    INJECT all: <announcement every player reads>
    INJECT <player>: <private message to one player>
    MUTE <player>
    UNMUTE <player>
    NOTE <private bookkeeping, no effect>
    STOP
    If nothing needs doing right now, reply with a single NOTE line.
  line: "#{id} {clock} {name}: {message}"
  room_header: "=== Room {room} (members: {members}) ==="
  log_header: "Your past commands and notes:"
  log_line: "({clock}) {text}"
  log_empty: "(none yet)"
  tally_header: "Structured moves since your last check:"
  tally_line: "{name} in {room}: {counts}"
  tallies:
    - name: vote
      room: village
      pattern: "^\\s*VOTE\\s+([A-Za-z]+)\\s*$"
    - name: kill
      room: night
      pattern: "^\\s*KILL\\s+([A-Za-z]+)\\s*$"
