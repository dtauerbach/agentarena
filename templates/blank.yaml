# A blank game: one room, plain templates, a placeholder premise. Replace
# description and common_prompt with your game, add private notes and
# reveals in the designer, and optionally a moderator block (see
# experiments/mafia/auto.yaml for a worked example).
name: base
description: >-
  A blank game. Write the shared premise in the universal prompt; add private
  notes, reveals, rooms, or a moderator as the game needs them.
seed: 1
duration: 3600
concurrency: 5

model:
  provider: claude_code
  name: claude-haiku-4-5
  temperature: 1.0
  max_tokens: 150

agents:
  count: 6
  names: auto
  identity: persistent
  mark_self: true

activity:
  mode: ticks
  tick: 60
  p: 0.3
  first_wake: sampled
  check_back: false

post:
  mode: forum
wake:
  mode: direct
board:
  visibility: full
  block_posts: 20
output:
  mode: text
  max_words: 60

common_prompt: |
  You are playing a game with the other people on this message board.
  (Describe the game here: the premise, what players can do, how it ends.)

private_prompts: {}
injections: []

render:
  line: "#{id} {clock} {name}: {message}"
  anonymous_line: "#{id} {clock} — {message}"
  self_line: "#{id} {clock} You: {message}"
  empty_board: "(Nothing has been posted yet.)"
  private_header: "Private notes. Only you can see these:"
  you_are_line: "You are {name}."
  injection_line: "({clock}) {text}"
  first_wake_line: "You are looking at the board for the first time."
  new_since_line: "Posts #{id} onward are new since you last checked."
  nothing_new_line: "Nothing new since you last checked."
  turn_instruction: >-
    You have just checked the board. Reply with only what you post, at most
    {max_words} words, or reply PASS to post nothing.
  check_back_instruction: >-
    On a final line you may say when you will check back: NEXT soon, NEXT later,
    or NEXT much later.
  gate_instruction: >-
    You have just checked the board. Reply ACT if you want to post something now,
    or PASS if not.
  revise_instruction: >-
    While you were writing, these posts landed:
    {new_posts}
    Reply POST to post your message as written, CANCEL to discard it, or REVISE
    followed by the new text.

metrics:
  bucket_seconds: 300
  concurrent_window: 10
  meta_talk_patterns: []
